# The one Compose file for this project (production-style; also fine locally).
#   docker compose up -d --build     # start / update everything
#   docker compose ps                # status
#
# - Every Celery queue in workers/celery_app.py has a consumer, and the rate
#   controller runs (it owns the rate_control READY state the send worker needs).
# - Ports bind to 127.0.0.1 only; the reverse proxy (Caddy) terminates TLS.
#   Host ports are configurable (BACKEND_HOST_PORT / FRONTEND_HOST_PORT in .env,
#   defaults 4140 / 4141) because this stack shares a server with other
#   projects: 8000 / 3000 are taken there, and the original Outly install
#   uses 4130 / 4131.
# - Fixed project name, so containers/networks cannot collide with other
#   Compose projects on the same host. It must not be "outly": the original
#   product runs under that name on the same server.
# - Restart policies, and Redis is never published outside the Docker network.
# - Worker groups follow docs/architecture/WORKERS.md: imports cannot starve
#   safety (webhooks) or send capacity.
# See docs/operations/DEPLOYMENT.md.

name: revenueos-email

x-app-env: &app-env
  env_file:
    - .env
  environment:
    # Inside Docker the broker is the "redis" service, whatever .env says
    # (a local-dev .env commonly points at localhost).
    REDIS_URL: redis://redis:6379/0

# Same as x-app-env plus a database connection policy. Every process keeps its own
# pool, and all of them (plus the API and any local dev stack) share the Supabase
# Session pooler's limited client slots (docs/operations/DEPLOYMENT.md, "Database
# connection budget"). There are nine worker processes (Celery --concurrency counts
# one each), so even one idle connection apiece used most of a 15-slot pooler and
# left the API unable to open connections (EMAXCONNSESSION). Workers therefore keep
# NO idle connection by default (pool size 0 = open on use, close on release).
# Override with WORKER_DB_POOL_SIZE / WORKER_DB_MAX_OVERFLOW in .env. The API keeps
# DB_POOL_SIZE / DB_MAX_OVERFLOW from .env.
x-worker-env: &worker-env
  env_file:
    - .env
  environment:
    REDIS_URL: redis://redis:6379/0
    DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-0}
    DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-2}

# Cap container logs: this stack shares a server, and unbounded json-file logs
# would slowly fill its disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-worker: &worker
  logging: *default-logging
  build:
    context: .
    dockerfile: workers/Dockerfile
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  networks:
    - app

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    <<: *app-env
    # AI drafting and company analysis run in the API process (ADR-0016), so it
    # also loads .env.personalization, where PERSONALIZATION_OPENAI_API_KEY lives.
    # An explicit key overrides the one merged from *app-env. Without the file the
    # API simply reports AI drafting as unavailable and everything else works.
    # `required: false` needs Docker Compose 2.24 or newer.
    env_file:
      - path: .env
      - path: .env.personalization
        required: false
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-4140}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app

  worker-general:
    <<: [*worker, *worker-env]
    command:
      [
        "celery", "-A", "workers.celery_app:celery_app", "worker",
        "--loglevel=INFO", "--queues=maintenance,imports,campaigns",
        "--concurrency=2",
      ]

  worker-events:
    <<: [*worker, *worker-env]
    command:
      [
        "celery", "-A", "workers.celery_app:celery_app", "worker",
        "--loglevel=INFO", "--queues=webhooks", "--concurrency=1",
      ]

  worker-send:
    <<: [*worker, *worker-env]
    command:
      [
        "celery", "-A", "workers.celery_app:celery_app", "worker",
        "--loglevel=INFO", "--queues=email.send", "--concurrency=2",
      ]

  worker-sync:
    <<: [*worker, *worker-env]
    command:
      [
        "celery", "-A", "workers.celery_app:celery_app", "worker",
        "--loglevel=INFO", "--queues=mailbox.sync", "--concurrency=1",
      ]

  # Hyper-personalized generation (docs/adr/0011-0013). With the API (ADR-0016),
  # one of only two services that receive PERSONALIZATION_OPENAI_API_KEY: put it
  # in .env.personalization (not in .env, which every other container loads).
  # Idle unless
  # PERSONALIZATION_ENABLED=true in .env. `required: false` needs Docker Compose
  # 2.24 or newer.
  worker-personalization:
    <<: [*worker, *worker-env]
    env_file:
      - path: .env
      - path: .env.personalization
        required: false
    command: ["python", "-m", "workers.personalization_worker"]

  rate-controller:
    <<: [*worker, *worker-env]
    command: ["python", "-m", "workers.rate_controller"]

  # Exactly one replica: due-work discovery is concurrency-safe, but there is
  # no reason to run more than one.
  scheduler:
    <<: [*worker, *worker-env]
    command: ["python", "-m", "workers.scheduler"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # NEXT_PUBLIC_* values are compiled into the JavaScript bundle at build
      # time. Changing them in .env requires rebuilding this image.
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL in .env}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set NEXT_PUBLIC_SUPABASE_URL in .env}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set NEXT_PUBLIC_SUPABASE_ANON_KEY in .env}
    restart: unless-stopped
    logging: *default-logging
    environment:
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-4141}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app

networks:
  app:
    driver: bridge
