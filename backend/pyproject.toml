[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "email-outreach-backend"
version = "0.1.0"
description = "Phase 0 backend foundation for the email outreach platform."
requires-python = ">=3.12"
dependencies = [
  # Celery/kombu 5.7 require redis-py >= 6.1 when a worker opens its broker
  # connection (VersionMismatch), which conflicts with the redis<6 pin below, so
  # every Celery worker crash-looped. Stay below 5.7 until redis is upgraded.
  "celery>=5.4,<5.7",
  "kombu>=5.4,<5.7",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  # kombu's Redis transport imports `packaging`; kombu 5.7 stopped installing it
  # by default. Kept so the runtime does not depend on that detail.
  "packaging>=23",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "PyJWT[crypto]>=2.9,<3",
  "python-multipart>=0.0.9",
  "redis>=5,<6",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "fakeredis>=2.24,<3",
  # fakeredis's EVAL/Lua scripting support (used by the rate limiter's
  # tests) requires lupa; without it fakeredis raises "unknown command
  # 'eval'" for every script call.
  "lupa>=2.1,<3",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "python-dotenv>=1.0,<2",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection system requires Depends(...)/require_permission(...)
# as literal argument defaults; this is the documented, idiomatic pattern, not a bug.
"app/api/**.py" = ["B008"]
"app/core/permissions.py" = ["B008"]
# Long SQL literals: the statements read better unwrapped than re-broken to fit.
"app/modules/personalization/repository.py" = ["E501"]
"app/modules/personalization/api_repository.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
markers = [
  "integration: requires a real Postgres/Supabase project (see tests/integration/conftest.py); needs .env with DATABASE_URL, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, NEXT_PUBLIC_SUPABASE_ANON_KEY",
]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
strict = true
plugins = []

